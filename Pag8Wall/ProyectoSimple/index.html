<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>8th Wall - Castillo Constantina</title>
    <!-- Cargamos todo lo necesario para que 8th Wall funcione por CDN -->
    <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
    <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
    <script src="https://cdn.8thwall.com/web/landing-page/landing-page.js"></script>
    <script async src="https://apps.8thwall.com/xrweb"></script>
</head>

<body>
    <!-- 8th Wall pone automáticamente la pantalla de carga -->
    <xrextras-loading></xrextras-loading>
    
    <!-- Aquí empieza la escena AR -->
    <a-scene
        xrweb
        xrextras-almost-there
        xrextras-loading
        xrextras-runtime-error
        renderer="colorManagement: true;">

        <!-- La cámara: 8th Wall la maneja solo al detectar movimiento -->
        <a-camera position="0 8 0" raycaster="objects: .cantap" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

        <!-- Luces para que el castillo se vea bien (ambiental y direccional) -->
        <a-light type="ambient" intensity="1.0"></a-light>
        <a-light type="directional" intensity="0.5" position="1 1 1"></a-light>

        <!-- TU CASTILLO: Lo cargamos de donde me dijiste -->
        <a-entity
            id="castle"
            gltf-model="../../TodosLosDiseños/TodosGLB/CastilloConstantinaBAKE.glb"
            position="0 0 0"
            scale="0.05 0.05 0.05"
            visible="false">
        </a-entity>

        <!-- Piso invisible: Permite que 8th Wall ancle el modelo al suelo -->
        <a-plane id="ground" rotation="-90 0 0" width="100" height="100" material="opacity: 0; transparent: true"></a-plane>

    </a-scene>

    <script>
        // Cuando el sistema esté listo y detecte el mundo, mostramos el castillo
        window.addEventListener('xrloaded', () => {
            console.log("Sistema listo.");
            const castle = document.getElementById('castle');
            castle.setAttribute('visible', 'true');
        });
    </script>
</body>
</html>
