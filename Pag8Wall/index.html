<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>8th Wall Nativo (Sin A-Frame)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- 1. Cargamos el motor de 3D (Three.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r126/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r126/examples/js/loaders/GLTFLoader.js"></script>

    <!-- 2. Cargamos el motor de Realidad Aumentada (8th Wall) -->
    <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
    <script async src="https://apps.8thwall.com/xrweb"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <!-- Capa de 8th Wall para errores y carga -->
    <xrextras-loading></xrextras-loading>

    <script>
        let scene, camera, renderer, castle;

        // Función principal que arranca todo
        const initAR = () => {
            // A. Creamos la "Escena" de Three.js (Donde vivirá el castillo)
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 1000);
            renderer = new THREE.WebGLRenderer({
                alpha: true, // Importante: para que se vea la cámara real debajo
                antialias: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // B. Luces
            const light = new THREE.DirectionalLight(0xffffff, 1.0);
            light.position.set(1, 1, 1);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040, 2.0));

            // C. Cargamos el Castillo de Constantina
            const loader = new THREE.GLTFLoader();
            loader.load('../TodosLosDiseños/TodosGLB/CastilloConstantinaBAKE.glb', (gltf) => {
                castle = gltf.scene;
                castle.scale.set(0.05, 0.05, 0.05); // escala pequeña
                castle.visible = false; // Se oculta hasta que se detecte el suelo
                scene.add(castle);
                console.log("Castillo cargado.");
            });

            // D. Iniciamos 8th Wall (El "Rastreador")
            XR8.addCameraPipelineModules([
                XR8.GlTextureRenderer.pipelineModule(),      // Dibuja la cámara real
                XR8.Threejs.pipelineModule(),                // 8Wall con Three.js
                XR8.XrController.pipelineModule(),           // El motor de suelo (SLAM)
                XRExtras.AlmostThere.pipelineModule(),       // Comprobador de compatibilidad
                XRExtras.Loading.pipelineModule(),           // Pantalla de carga
                XRExtras.RuntimeError.pipelineModule(),      // Errores
            ]);

            // Configuramos qué pasa cada vez que el móvil detecta un movimiento
            XR8.addCameraPipelineModule({
                name: 'mi-logica',
                onUpdate: () => {
                    // Aquí es donde 8th Wall mueve la cámara de Three.js sola
                },
                onStart: () => {
                    // Cuando se detecte el suelo aparece el modelo
                    if (castle) castle.visible = true;
                }
            });

            XR8.run({ canvas: renderer.domElement });
        }
        window.onload = () => {
            if (window.XR8) {
                initAR();
            } else {
                window.addEventListener('xrloaded', initAR);
            }
        };
    </script>
</body>

</html>
