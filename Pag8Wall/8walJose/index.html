<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ar_holograma</title>

  <!-- Open Graph / Social Meta -->
  <meta itemprop="name" content="ar_holograma">
  <meta name="twitter:title" content="ar_holograma">
  <meta property="og:title" content="ar_holograma">
  <meta property="og:site_name" content="ar_holograma">

  <meta name="description" content="ar_holograma.">
  <meta itemprop="description" content="ar_holograma.">
  <meta property="og:description" content="ar_holograma.">
  <meta name="twitter:description" content="ar_holograma.">

  <!-- 8th Wall Scripts -->
  <script crossorigin="anonymous" src="./external/runtime/runtime.js"></script>
  <script crossorigin="anonymous" src="./external/xr/xr.js" async="true" data-preload-chunks="face, slam"></script>

  <style>
    /* Button to show the Plano */
    #show-plano-btn {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;

      padding: 14px 36px;
      border: none;
      border-radius: 50px;
      cursor: pointer;

      /* Gradient background */
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #ffffff;
      font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;

      /* Soft shadow */
      box-shadow: 0 6px 20px rgba(0, 114, 255, 0.4);

      /* Smooth transitions */
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.3s ease;
    }

    #show-plano-btn:hover {
      transform: translateX(-50%) scale(1.05);
      box-shadow: 0 8px 28px rgba(0, 114, 255, 0.55);
    }

    #show-plano-btn:active {
      transform: translateX(-50%) scale(0.97);
      box-shadow: 0 4px 12px rgba(0, 114, 255, 0.3);
    }

    /* Botón de Silencio Premium */
    #mute-btn {
      position: fixed;
      bottom: 40px;
      right: 20px;
      z-index: 9999;
      width: 54px;
      height: 54px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: none;
    }

    #mute-btn:active {
      transform: scale(0.85);
      background: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>

<body>
  <!-- Elemento de vídeo oculto para el sistema de Jose Manuel -->
  <video id="video" 
    src="video1.mp4" 
    playsinline 
    webkit-playsinline 
    muted 
    crossorigin="anonymous" 
    loop="false" 
    style="display:none">
  </video>

  <!-- Button to show the Plano in AR -->
  <button id="show-plano-btn">Mostrar Plano</button>

  <!-- Botón de Mute Dinámico -->
  <button id="mute-btn">🔊</button>

  <script src="bundle.js"></script>

  <!-- Lógica de Silencio (Separada del motor de Jose) -->
  <script>
    const video = document.getElementById('video');
    const startBtn = document.getElementById('show-plano-btn');
    const muteBtn = document.getElementById('mute-btn');

    startBtn.addEventListener('click', () => {
      muteBtn.style.display = 'flex';
      muteBtn.innerText = '🔊';
    });

    muteBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      muteBtn.innerText = video.muted ? '🔇' : '🔊';
    });

    video.addEventListener('ended', () => {
      muteBtn.style.display = 'none';
      muteBtn.innerText = '🔊';
    });
  </script>
</body>

</html>
