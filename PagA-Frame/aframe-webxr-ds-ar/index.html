<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>AR Sin Marcador</title>
    <!-- para moviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- importamos aframe y extras para animaciones -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <!-- importamos los estilos externos -->
    <link rel="stylesheet" href="./src/css/style.css">
</head>


<body>
    <audio id="sonido-ar" src="https://www.soundjay.com/nature/wind-01.mp3" loop prefetch></audio>
    
    <!-- Tutorial visual -->
    <div id="tutorial" class="tutorial-container" style="display: none;">
        <h3 style="color: #111; margin-bottom: 25px;">¿Cómo funciona?</h3>
        <div class="tutorial-step">
            <div class="step-icon">1</div>
            <div class="step-text">Elige un modelo y pulsa "Ver en AR".</div>
        </div>
        <div class="tutorial-step">
            <div class="step-icon">2</div>
            <div class="step-text">Mueve el móvil despacio para encontrar el suelo.</div>
        </div>
        <div class="tutorial-step">
            <div class="step-icon">3</div>
            <div class="step-text">Cuando veas el círculo azul, toca para plantar el castillo.</div>
        </div>
        <button id="close-tutorial">EMPEZAR</button>
    </div>

    <div id="ui-container">
        <!-- menú de selección -->
        <div id="selection-menu" class="menu-container">
            <h3>Visor de Monumentos</h3>
            <div class="options-grid">
                <button class="option-button" id="btn-alanis" data-glb="./assets/GLB/CastilloAlanisBAKE.glb"
                    data-usdz="./assets/USDZ/CastilloAlanisBAKE.usdz" data-scale="0.05 0.05 0.05"
                    data-info="Fortificación mudéjar del siglo XIV. Situada sobre un cerro, fue clave en la defensa de la Sierra Norte de Sevilla.">Alanís</button>
                <button class="option-button" id="btn-constantina" data-glb="./assets/GLB/CastilloConstantinaBAKE.glb"
                    data-usdz="./assets/USDZ/CastilloConstantinaBAKE.usdz" data-scale="0.05 0.05 0.05"
                    data-info="Fortaleza de origen árabe construida sobre restos romanos. Su torre del homenaje vigila toda la localidad.">Constantina</button>
                <button class="option-button" id="btn-victoria" data-glb="./assets/GLB/TorreVictoriaBAKE.glb"
                    data-usdz="./assets/USDZ/TorreVictoriaBAKE.usdz" data-scale="0.05 0.05 0.05"
                    data-info="Antigua torre del convento de la Victoria en Estepa. Destaca por su estilo barroco y sus impresionantes vistas.">T. Victoria</button>
                <button class="option-button" id="btn-equipacion" data-glb="./assets/GLB/Equipacion.glb"
                    data-usdz="./assets/USDZ/Equipacion.usdz" data-scale="0.05 0.05 0.05"
                    data-info="Modelo 3D detallado de la equipación deportiva. Visualiza cada detalle y textura en realidad aumentada.">Equipación</button>
            </div>

            <div class="test-container">
                <button class="option-button btn-test" id="btn-animado" data-glb="./assets/GLB/Fox.glb"
                    data-usdz="./assets/USDZ/toy_drummer.usdz" data-scale="0.02 0.02 0.02"
                    data-info="Zorro animado para pruebas de WebXR. Permite verificar las animaciones y el refresco de la escena.">Prueba Visual</button>
            </div>
        </div>

        <!-- ficha informativa -->
        <div id="info-card" class="info-card" style="display: none;">
            <h4 id="info-title">Título</h4>
            <p id="info-text">Descripción...</p>
            <button id="close-info">Entendido</button>
        </div>

        <!-- botón "i" para abrir la ficha -->
        <button id="info-button" style="display: none;">i</button>

        <!-- texto que va cambiando -->
        <div id="instruction">Mueve el móvil despacio para encontrar el suelo</div>

        <!-- texto de carga -->
        <div id="loading-text">Cargando...</div>

        <!-- oculto hasta que se elija una opción -->
        <button id="ar-button" style="display: none;">Ver en AR</button>
    </div>

    <!-- enlace invisible para iphone (usdz) -->
    <a id="enlace-ios" rel="ar" href="#" style="display: none;">
        <img src="" alt="AR">
    </a>

    <!-- importamos nuestro script -->
    <script src="./src/js/app.js"></script>

    <!-- escena principal -->
    <a-scene shadow="type: pcfsoft"
        webxr="requiredFeatures: hit-test; optionalFeatures: local, local-floor, dom-overlay; overlayElement: #ui-container"
        xr-mode-ui="enabled: false" background="color: transparent; transparent: true"
        renderer="colorManagement: true; antialias: true;"
        device-orientation-permission-ui="allowButtonText: Permitir; denyButtonText: Denegar; cancelButtonText: Cancelar">

        <a-camera position="0 1.6 0"></a-camera>

        <!-- Iluminación unificada -->
        <a-light type="ambient" intensity="0.7"></a-light>
        <a-light type="directional" position="-1 4 1" intensity="1.2" cast-shadow="true" 
            shadow-camera-left="-5" shadow-camera-bottom="-5" shadow-camera-right="5" shadow-camera-top="5"></a-light>

        <!-- el circulito donde se va a colocar el modelo -->
        <a-entity hit-test-handler visible="false">
            <a-ring color="#00ffff" radius-inner="0.1" radius-outer="0.15" rotation="-90 0 0" opacity="0.8"></a-ring>
        </a-entity>

    </a-scene>
</body>

</html>
